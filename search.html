---
layout: default
title: Поиск
permalink: /search/
---

<div class="search-container">
    <h1 class="search-title">Результаты поиска</h1>

    <div id="search-results"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Get the query parameter from the URL
        const params = new URLSearchParams(window.location.search);
        const query = params.get('q')?.trim();

        if (!query) {
            document.getElementById('search-results').innerHTML = '<p>Введите поисковый запрос</p>';
            return;
        }

        // Display the query and loading
        document.getElementById('search-results').innerHTML = `<p>Поиск: <strong>${query}</strong></p><div class="search-loading">Загрузка результатов...</div>`;

        // Generate documents array using Jekyll Liquid
        {% assign counter = 0 %}
        var documents = [
            {% for post in site.posts %}
            {
                "id": {{ counter }},
                "title": {{ post.title | escape | jsonify }},
                "url": {{ post.url | relative_url | jsonify }},
                "date": {{ post.date | date: "%d.%m.%Y" | jsonify }},
                "excerpt": {{ post.excerpt | strip_html | truncatewords: 50 | escape | jsonify }},
                "content": {{ post.content | strip_html | truncate: 3000 | escape | jsonify }},
                "image": {% if post.image %}{{ post.image | relative_url | jsonify }}{% else %}""
                {% endif %}
            }{% assign counter = counter | plus: 1 %}{% unless forloop.last %},{% endunless %}
            {% endfor %}
            {% for page in site.pages %}
            {% if page.title and page.title != '' and page.permalink != '/search/' and page.layout != 'none' %}
            ,
            {
                "id": {{ counter }},
                "title": {{ page.title | escape | jsonify }},
                "url": {{ page.url | relative_url | jsonify }},
                "date": "",
                "excerpt": {{ page.content | strip_html | truncatewords: 50 | escape | jsonify }},
                "content": {{ page.content | strip_html | truncate: 3000 | escape | jsonify }},
                "image": {% if page.image %}{{ page.image | relative_url | jsonify }}{% else %}""
                {% endif %}
            }{% assign counter = counter | plus: 1 %}
            {% endif %}
            {% endfor %}
        ];

        if (documents.length === 0) {
            document.getElementById('search-results').innerHTML = '<p>Нет контента для поиска.</p>';
            return;
        }

        // Custom search function
        function customSearch(queryLower, docs) {
            const results = [];

            docs.forEach(doc => {
                let score = 0;
                const titleLower = doc.title.toLowerCase();
                const contentLower = doc.content.toLowerCase();

                // Поиск в title (буст x2)
                if (titleLower.includes(queryLower)) {
                    score += 2;
                    if (titleLower.startsWith(queryLower)) score += 1;
                }

                // Поиск в content
                if (contentLower.includes(queryLower)) {
                    score += 1;
                    const sentences = contentLower.split(/[.!?]+/);
                    if (sentences.some(s => s.trim().startsWith(queryLower))) score += 1;
                }

                if (score > 0) {
                    results.push({ ...doc, score: score });
                }
            });

            // Сортировка по score (desc)
            results.sort((a, b) => b.score - a.score);
            return results.map(r => r); // Без score для display
        }

        // Perform search
        const results = customSearch(query.toLowerCase(), documents);

        // Hide loading
        const loading = document.querySelector('.search-loading');
        if (loading) loading.remove();

        displayResults(results, query);
    });

    function displayResults(results, query) {
        const resultsDiv = document.getElementById('search-results');

        if (results.length === 0) {
            resultsDiv.innerHTML += `<p>Ничего не найдено по запросу: <strong>${query}</strong></p>`;
            return;
        }

        let html = `<p class="search-count">Найдено ${results.length} результатов по запросу: <strong>${query}</strong></p><section class="search-results-list">`;

        results.forEach(result => {
            html += `
                <article>
                    <div class="post-container">
                        <div class="post-content">
                            <h2><a href="${result.url}">${result.title}</a></h2>
                            ${result.image && result.image !== '' ? `
                                <div class="post-image">
                                    <a href="${result.url}">
                                        <img src="${result.image}" alt="${result.title}">
                                    </a>
                                </div>
                            ` : ''}
                            <div class="excerpt">${result.excerpt}</div>
                        </div>
                        <footer class="info">
                            <div class="info-inner">
                                <div class="post-meta">
                                    ${result.date ? `<time datetime="${result.date}">${result.date}</time>` : ''}
                                    ${result.date ? '<span class="dot"></span>' : ''}
                                    <span>{{ site.author }}</span>
                                </div>
                            </div>
                        </footer>
                    </div>
                </article>
            `;
        });

        html += '</section>';
        resultsDiv.innerHTML += html;
    }
</script>

<style>
    .search-loading { text-align: center; padding: 20px; }
    .search-count { font-weight: bold; margin: 10px 0; }
    .search-results-list { display: flex; flex-direction: column; gap: 20px; }
</style>
