---
layout: default
title: Поиск
permalink: /search/
---

<div class="search-container">
    <h1 class="search-title">Результаты поиска</h1>

    <div id="search-results"></div>
</div>

<script src="https://unpkg.com/lunr/lunr.js"></script> <!-- CDN для Lunr.js -->

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Get the query parameter from the URL
        const params = new URLSearchParams(window.location.search);
        const query = params.get('q');

        if (!query) {
            document.getElementById('search-results').innerHTML = '<p>Введите поисковый запрос</p>';
            return;
        }

        // Display the query
        document.getElementById('search-results').innerHTML = `<p>Поиск: <strong>${query}</strong></p><div class="search-loading">Загрузка результатов...</div>`;

        // Fetch search index with baseurl support
        fetch('{{ site.baseurl }}/assets/js/search_index.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Не удалось загрузить индекс поиска: ' + response.status + ' ' + response.statusText);
                }
                return response.json();
            })
            .then(documents => {
                console.log('Search documents loaded:', documents); // Для отладки

                // Build Lunr index
                const idx = lunr(function () {
                    this.ref('url'); // Уникальный ключ
                    this.field('title', { boost: 10 }); // Буст для заголовка
                    this.field('content'); // Поиск по контенту

                    documents.forEach(function (doc) {
                        this.add(doc);
                    }, this);
                });

                // Perform search (Lunr поддерживает fuzzy и wildcards с *)
                const results = idx.search(query + '*'); // Добавляем * для частичных совпадений
                const resultDocs = results.map(result => documents.find(doc => doc.url === result.ref));

                displayResults(resultDocs, query);
            })
            .catch(error => {
                console.error('Error loading search index:', error);
                document.getElementById('search-results').innerHTML = '<p>Ошибка при поиске. Пожалуйста, попробуйте позже.</p>';
            });
    });

    function displayResults(results, query) {
        const resultsDiv = document.getElementById('search-results');

        if (results.length === 0) {
            resultsDiv.innerHTML = `<p>Ничего не найдено по запросу: <strong>${query}</strong></p>`;
            return;
        }

        let html = `<p class="search-count">Найдено ${results.length} результатов по запросу: <strong>${query}</strong></p>`;
        html += '<section class="search-results-list">';

        results.forEach(result => {
            if (!result) return; // Пропуск, если документ не найден
            html += `
                <article>
                    <div class="post-container">
                        <div class="post-content">
                            <h2><a href="${result.url}">${result.title}</a></h2>
                            ${result.image ? `
                                <div class="post-image">
                                    <a href="${result.url}">
                                        <img src="${result.image}" alt="${result.title}">
                                    </a>
                                </div>
                            ` : ''}
                            <div class="excerpt">${result.excerpt}</div>
                        </div>
                        <footer class="info">
                            <div class="info-inner">
                                <div class="post-meta">
                                    ${result.date ? `<time datetime="${result.date}">${result.date}</time>` : ''}
                                    ${result.date ? '<span class="dot"></span>' : ''}
                                    <span>{{ site.author }}</span>
                                </div>
                            </div>
                        </footer>
                    </div>
                </article>
            `;
        });

        html += '</section>';
        resultsDiv.innerHTML = html;
    }
</script>
