---
layout: default
title: Поиск
permalink: /search/
---

<div class="search-container">
    <h1 class="search-title">Результаты поиска</h1>

    <div id="search-results"></div>
</div>

<script src="https://unpkg.com/lunr/lunr.js"></script> <!-- CDN для Lunr.js -->

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Get the query parameter from the URL
        const params = new URLSearchParams(window.location.search);
        const query = params.get('q');

        if (!query) {
            document.getElementById('search-results').innerHTML = '<p>Введите поисковый запрос</p>';
            return;
        }

        // Display the query and loading
        document.getElementById('search-results').innerHTML = `<p>Поиск: <strong>${query}</strong></p><div class="search-loading">Загрузка результатов...</div>`;

        // Generate documents array using Jekyll Liquid (processed at build time)
        {% assign counter = 0 %}
        var documents = [
            {% for post in site.posts %}
            {
                "id": {{ counter }},
                "title": {{ post.title | jsonify }},
                "url": {{ post.url | relative_url | jsonify }},
                "date": {{ post.date | date: "%d.%m.%Y" | jsonify }},
                "excerpt": {{ post.excerpt | strip_html | truncatewords: 50 | jsonify }},
                "content": {{ post.content | strip_html | strip_newlines | escape_once | jsonify }},
                "image": {% if post.image %}{{ post.image | relative_url | jsonify }}{% else %}""{% endif %}
            }{% assign counter = counter | plus: 1 %}{% unless forloop.last %},{% endunless %}
            {% endfor %}
            {% for page in site.pages %}
            {% if page.title and page.title != '' and page.permalink != '/search/' and page.layout != 'none' %}
            ,
            {
                "id": {{ counter }},
                "title": {{ page.title | jsonify }},
                "url": {{ page.url | relative_url | jsonify }},
                "date": "",
                "excerpt": {{ page.content | strip_html | truncatewords: 50 | jsonify }},
                "content": {{ page.content | strip_html | strip_newlines | escape_once | jsonify }},
                "image": {% if page.image %}{{ page.image | relative_url | jsonify }}{% else %}""{% endif %}
            }{% assign counter = counter | plus: 1 %}
            {% endif %}
            {% endfor %}
        ];

        console.log('Documents loaded:', documents); // Для отладки

        // Build Lunr index
        const idx = lunr(function () {
            this.ref('id'); // Уникальный ключ
            this.field('title', { boost: 10 }); // Буст для заголовка
            this.field('content'); // Поиск по контенту
        });

        documents.forEach(function (doc) {
            idx.add(doc);
        });

        // Perform search
        const results = idx.search(query + '*'); // * для частичных совпадений
        const resultDocs = results.map(result => documents.find(doc => doc.id == result.ref));

        // Hide loading and display results
        document.querySelector('.search-loading').style.display = 'none';
        displayResults(resultDocs, query);
    });

    function displayResults(results, query) {
        const resultsDiv = document.getElementById('search-results');

        if (results.length === 0) {
            resultsDiv.innerHTML += `<p>Ничего не найдено по запросу: <strong>${query}</strong></p>`;
            return;
        }

        let html = `<p class="search-count">Найдено ${results.length} результатов по запросу: <strong>${query}</strong></p><section class="search-results-list">`;

        results.forEach(result => {
            if (!result) return;
            html += `
                <article>
                    <div class="post-container">
                        <div class="post-content">
                            <h2><a href="${result.url}">${result.title}</a></h2>
                            ${result.image && result.image !== '' ? `
                                <div class="post-image">
                                    <a href="${result.url}">
                                        <img src="${result.image}" alt="${result.title}">
                                    </a>
                                </div>
                            ` : ''}
                            <div class="excerpt">${result.excerpt}</div>
                        </div>
                        <footer class="info">
                            <div class="info-inner">
                                <div class="post-meta">
                                    ${result.date ? `<time datetime="${result.date}">${result.date}</time>` : ''}
                                    ${result.date ? '<span class="dot"></span>' : ''}
                                    <span>{{ site.author }}</span>
                                </div>
                            </div>
                        </footer>
                    </div>
                </article>
            `;
        });

        html += '</section>';
        resultsDiv.innerHTML += html;
    }
</script>
